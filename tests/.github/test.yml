name: Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Start test API
        run: |
          python app.py &
          for i in {1..10}; do
            curl -s http://127.0.0.1:8000/api/products && break
            sleep 1
          done

      - name: Run tests
        run: python -m pytest -v 